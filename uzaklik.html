<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konum Doğrulama</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-family: monospace;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      margin: 16px 0 8px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .result-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      display: none;
    }
    .result-box.show { display: block; }
    .result-box.ok {
      background: #064e3b;
      border: 1px solid #10b981;
    }
    .result-box.far {
      background: #7f1d1d;
      border: 1px solid #ef4444;
    }
    .result-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .result-detail {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .coords {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-family: monospace;
    }
    .error {
      margin-top: 14px;
      padding: 12px;
      background: #7f1d1d;
      border-radius: 8px;
      color: #fecaca;
      font-size: 0.9rem;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 Konum Doğrulama</h1>
    <p class="subtitle">A noktasına göre B noktası mesafesi</p>

    <label>A Noktası — Latitude</label>
    <div class="row">
      <input type="number" id="aLat" step="any" value="41.0082" placeholder="Örn: 41.0082">
    </div>

    <label>A Noktası — Longitude</label>
    <div class="row">
      <input type="number" id="aLng" step="any" value="28.9784" placeholder="Örn: 28.9784">
    </div>

    <button id="btn" onclick="checkLocation()">Konumu Kontrol Et</button>
    <div class="status" id="status"></div>

    <div class="result-box" id="result">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="coords" id="coords"></div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script>
    // İki koordinat arası mesafe (metre) — Haversine formülü
    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Dünya yarıçapı (metre)
      const toRad = (d) => d * Math.PI / 180;

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function checkLocation() {
      const aLat = parseFloat(document.getElementById('aLat').value);
      const aLng = parseFloat(document.getElementById('aLng').value);
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const errorBox = document.getElementById('error');

      result.classList.remove('show', 'ok', 'far');
      errorBox.classList.remove('show');

      if (isNaN(aLat) || isNaN(aLng)) {
        showError('A noktası koordinatlarını doğru girin.');
        return;
      }

      if (!navigator.geolocation) {
        showError('Tarayıcınız konum servisini desteklemiyor.');
        return;
      }

      btn.disabled = true;
      status.textContent = 'B noktası (cihaz konumu) alınıyor…';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const bLat = pos.coords.latitude;
          const bLng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          const dist = distanceMeters(aLat, aLng, bLat, bLng);
          const distText = dist < 1000
            ? Math.round(dist) + ' metre'
            : (dist / 1000).toFixed(2) + ' km';

          const title = document.getElementById('resultTitle');
          const detail = document.getElementById('resultDetail');
          const coords = document.getElementById('coords');

          if (dist <= 100) {
            result.classList.add('show', 'ok');
            title.textContent = '✓ Doğru lokasyon';
            detail.textContent = `B noktası A noktasına ${distText} uzaklıkta (100 m içinde).`;
          } else {
            result.classList.add('show', 'far');
            title.textContent = '✗ Uzak lokasyon';
            detail.textContent = `B noktası A noktasından ${distText} uzakta (100 m’den fazla).`;
          }

          coords.innerHTML =
            `A: ${aLat.toFixed(6)}, ${aLng.toFixed(6)}<br>` +
            `B: ${bLat.toFixed(6)}, ${bLng.toFixed(6)}<br>` +
            `GPS doğruluğu: ~${Math.round(accuracy)} m`;

          status.textContent = 'Kontrol tamamlandı';
          btn.disabled = false;
        },
        (err) => {
          let msg = 'Konum alınamadı.';
          if (err.code === 1) msg = 'Konum izni reddedildi.';
          if (err.code === 2) msg = 'Konum bilgisi alınamadı.';
          if (err.code === 3) msg = 'Zaman aşımı. Tekrar deneyin.';
          showError(msg);
          status.textContent = '';
          btn.disabled = false;
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function showError(msg) {
      const errorBox = document.getElementById('error');
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }

    // Sayfa açılınca otomatik kontrol (isterseniz kaldırabilirsiniz)
    // checkLocation();
  </script>
</body>
</html>
